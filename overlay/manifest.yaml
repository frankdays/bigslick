# First-party infrastructure skills. MIT, same as the rest of the repo — this is not a
# return of the v0.2-removed proprietary layer, which was source-available only. These two
# exist because no vendored upstream covers them: company-onboarding writes the client
# context pack every other skill reads, and resource-hub is where provider config lives.
# Anything added here must be MIT and infrastructure, not marketing content (see CLAUDE.md).
core:
  path: core/skills

# ---------------------------------------------------------------------------
# Bundles. The root plugin ships ONLY the skills not listed below; each bundle becomes a
# separate installable plugin under bundles/<name>/. This exists because every skill's
# frontmatter description loads into every session - 209 skills cost ~28k always-on tokens,
# which is a tax on people who only ever wanted the SEO half. Membership is a partition:
# a skill appears in exactly one bundle, so installing several can never register a name
# twice. compose.py enforces both properties and fails on a duplicate or unknown name.
# ---------------------------------------------------------------------------
bundles:
  - name: seo
    description: >-
      Technical and on-page SEO: audits, briefs, architecture, backlinks, and the Ahrefs/Semrush/GSC data pulls.
    skills: [
