      seo-programmatic, seo-schema, seo-sitemap, seo-sxo, seo-technical, seo
      ]
  # zubair-trabzada/geo-seo-claude (MIT, 10.1k stars) — generative-engine optimisation.
  - name: geo-seo
    path: upstream/geo-seo/skills
    mode: include
    include: [
      geo-audit, geo-brand-mentions, geo-citability, geo-compare, geo-content,
      geo-crawlers, geo-llmstxt, geo-platform-optimizer, geo-proposal, geo-prospect,
      geo-report-pdf, geo-report, geo-schema, geo-technical, geo-update
