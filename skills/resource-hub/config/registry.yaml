# Resource Hub registry
# The ONLY file you edit to add/swap providers or models.
# Credentials are NEVER stored here — only the names of environment variables.

providers:
  anthropic:
    kind: llm
    api_base: https://api.anthropic.com/v1/messages
    api_key_env: ANTHROPIC_API_KEY
    models:
      frontier: claude-opus-4-8
      standard: claude-sonnet-4-6
      fast: claude-haiku-4-5-20251001
    notes: Best for reasoning, long docs, strategy work. Reachable from Claude.ai sandbox.

  openai:
    kind: llm
    api_base: https://api.openai.com/v1/chat/completions
    api_key_env: OPENAI_API_KEY
    models:
      frontier: SET_ME        # update to current model names when configuring
      fast: SET_ME
    notes: Alternate LLM + embeddings + image gen. Not reachable from Claude.ai sandbox.

  google:
    kind: llm
    api_base: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
    models:
      frontier: SET_ME
      long_context: SET_ME
    notes: Strong long-context option.

  perplexity:
    kind: search_llm
    api_base: https://api.perplexity.ai/chat/completions
    api_key_env: PERPLEXITY_API_KEY
    models:
      research: SET_ME
    notes: Cited web research. Also useful for GEO monitoring (how AI engines describe brands).

  dataforseo:
    kind: seo_data
    api_base: https://api.dataforseo.com/v3
    api_key_env: DATAFORSEO_LOGIN   # plus DATAFORSEO_PASSWORD
    notes: "Keywords, SERPs, backlinks. Alternatives: ahrefs, semrush — add if client has a subscription."

  apollo:
    kind: enrichment
    api_base: https://api.apollo.io/v1
    api_key_env: APOLLO_API_KEY
    notes: "Contact/company enrichment for ABM. Alternatives: clay, zoominfo."

  hubspot_mcp:
    kind: mcp
    connection: mcp   # use the connected MCP server, not raw HTTP
    notes: CRM data. Prefer MCP connection when available in the environment.

  connectsafely_mcp:
    kind: mcp
    connection: mcp
    notes: LinkedIn data & actions. Use with the linkedin-connectsafely-search skill rules.

# Capability -> provider assignments. Skills reference capabilities, never providers.
capabilities:
  deep_reasoning:
    provider: anthropic
    model: frontier
    fallbacks: [openai.frontier, google.frontier]
  research_synthesis:
    provider: perplexity
    model: research
    fallbacks: [builtin.web_search]   # builtin = Claude's native tools in claude.ai/Cowork
  bulk_classification:
    provider: anthropic
    model: fast
    fallbacks: [openai.fast]
  long_context_analysis:
    provider: anthropic
    model: standard
    fallbacks: [google.long_context]
  embeddings:
    provider: openai
    model: SET_ME
    fallbacks: []
  image_generation:
    provider: openai
    model: SET_ME
    fallbacks: []
  serp_seo_data:
    provider: dataforseo
    fallbacks: [builtin.web_search]
  contact_enrichment:
    provider: apollo
    fallbacks: [connectsafely_mcp]
  crm_data:
    provider: hubspot_mcp
    fallbacks: []
  social_data:
    provider: connectsafely_mcp
    fallbacks: []

defaults:
  timeout_seconds: 120
  max_retries: 2
  log_calls: false   # set true to append call metadata to logs/calls.jsonl for cost review
